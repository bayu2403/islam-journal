<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>WeekStrip</title></head>
<body>
<div class="mb mb-pv"><div class="mb-pv-col"><h2 class="mb-h2">Juli · Muharram–Safar</h2><div class="mb-week" role="tablist" aria-label="Minggu ini">
  <button class="mb-day " role="tab" aria-selected="false"><span class="dn">Sen</span><span class="c">21</span><span class="h">26</span></button>
  <button class="mb-day " role="tab" aria-selected="false"><span class="dn">Sel</span><span class="c">22</span><span class="h">27</span></button>
  <button class="mb-day " role="tab" aria-selected="false"><span class="dn">Rab</span><span class="c">23</span><span class="h">28</span></button>
  <button class="mb-day " role="tab" aria-selected="false"><span class="dn">Kam</span><span class="c">24</span><span class="h">29</span></button>
  <button class="mb-day " role="tab" aria-selected="false"><span class="dn">Jum</span><span class="c">25</span><span class="h">30</span></button>
  <button class="mb-day today" role="tab" aria-selected="false" aria-current="date"><span class="dn">Sab</span><span class="c">26</span><span class="h">1</span></button>
  <button class="mb-day selected" role="tab" aria-selected="true"><span class="dn">Ahad</span><span class="c">27</span><span class="h">2</span></button>
</div></div></div>
<script>MB.icons();</script>
