<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="mb mb-pv">
<div class="mb-pv-row"><span class="mb-pv-cap">primary</span>
  <button class="mb-btn mb-btn-primary">Simpan</button>
  <button class="mb-btn mb-btn-primary is-hover">Hover</button>
  <button class="mb-btn mb-btn-primary is-active">Pressed</button>
  <button class="mb-btn mb-btn-primary is-focus">Focus</button>
  <button class="mb-btn mb-btn-primary" disabled>Disabled</button></div>
<div class="mb-pv-row"><span class="mb-pv-cap">secondary</span>
  <button class="mb-btn mb-btn-secondary">Simpan</button>
  <button class="mb-btn mb-btn-secondary is-hover">Hover</button>
  <button class="mb-btn mb-btn-secondary is-active">Pressed</button>
  <button class="mb-btn mb-btn-secondary is-focus">Focus</button>
  <button class="mb-btn mb-btn-secondary" disabled>Disabled</button></div>
<div class="mb-pv-row"><span class="mb-pv-cap">outline</span>
  <button class="mb-btn mb-btn-outline">Simpan</button>
  <button class="mb-btn mb-btn-outline is-hover">Hover</button>
  <button class="mb-btn mb-btn-outline is-active">Pressed</button>
  <button class="mb-btn mb-btn-outline is-focus">Focus</button>
  <button class="mb-btn mb-btn-outline" disabled>Disabled</button></div>
<div class="mb-pv-row"><span class="mb-pv-cap">ghost</span>
  <button class="mb-btn mb-btn-ghost">Simpan</button>
  <button class="mb-btn mb-btn-ghost is-hover">Hover</button>
  <button class="mb-btn mb-btn-ghost is-active">Pressed</button>
  <button class="mb-btn mb-btn-ghost is-focus">Focus</button>
  <button class="mb-btn mb-btn-ghost" disabled>Disabled</button></div>
<div class="mb-pv-row"><span class="mb-pv-cap">sizes</span><button class="mb-btn mb-btn-primary lg">Simpan rencana</button><button class="mb-btn mb-btn-outline icon" aria-label="Kembali"><i data-i="arrow-left"></i></button><button class="mb-fab" aria-label="Tambah"><i data-i="plus"></i></button></div>
</div>
<script>MB.icons();</script>
</body>
</html>
