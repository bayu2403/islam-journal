<!-- @dsCard height=288 -->
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Falak</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--background); color:var(--foreground); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; width:960px; overflow:hidden; background:var(--background); }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .slab { fill:var(--card-inverse); stroke:var(--card-inverse-border); stroke-width:1.5; }
  .tint { fill:var(--secondary); }
  .sun { fill:var(--primary); }
  .moon { fill:var(--accent); }
  .track { fill:none; stroke:var(--input); stroke-width:1; stroke-dasharray:2 5; }
  .prog { fill:none; stroke:var(--primary); stroke-width:3; stroke-linecap:round; }
  .node { fill:var(--background); stroke:var(--input); stroke-width:1.5; }
  .node.past { fill:var(--primary); stroke:var(--primary); }
  .star { fill:none; stroke:var(--primary); stroke-width:1; opacity:.5; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:112px; line-height:.92; font-weight:600; letter-spacing:-.04em; color:var(--foreground); }
  .tag { margin:var(--space-3) 0 0 6px; font:500 12px/18px var(--font-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted-foreground); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      card-inverse slab 288×224 (radius-xl, the holo card) · primary sun disc r16 · secondary pill 160×48 (radius-full) · accent moon disc r14 once — ≈38% of 960×288
  arrangement one tall holo slab bleeding off the right edge with satellites: the pill on the ground line at left, the sun riding the orbit above the slab, the moon low right
  pattern     "a literal motif" — the prayer orbit: a dashed input track and a primary progress arc crossing slab and ground, five prayer nodes spaced by real Jakarta times; one khatam (two squares at 45°) inside the slab
  scales      slab and pill sides in space-4 multiples; corners radius-xl and radius-full; orbit r 208 centred on the ground line; strokes 1 / 1.5 / 3
-->
<rect class="slab" x="208" y="48" width="288" height="224" rx="24"/>
<g transform="translate(352 168)"><rect class="star" x="-44" y="-44" width="88" height="88"/><rect class="star" x="-44" y="-44" width="88" height="88" transform="rotate(45)"/><rect class="star" x="-26" y="-26" width="52" height="52"/><rect class="star" x="-26" y="-26" width="52" height="52" transform="rotate(45)"/></g>
<rect class="tint" x="16" y="224" width="160" height="48" rx="24"/>
<circle class="moon" cx="388" cy="248" r="14"/>
<path class="track" d="M32 288 A208 208 0 0 1 448 288"/>
<path class="prog" d="M32 288 A208 208 0 0 1 334.5 102.7"/>
<circle class="node past" cx="32" cy="288" r="6"/>
<circle class="node past" cx="243.8" cy="80" r="6"/>
<circle class="node" cx="381.4" cy="135.4" r="6"/>
<circle class="node" cx="440.7" cy="233.6" r="6"/>
<circle class="node" cx="448" cy="288" r="6"/>
<circle class="sun" cx="334.5" cy="102.7" r="16"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Falak</h1>
  <p class="tag">Muslim Berislam · ibadah harian, dihitung dari langit</p>
</div>
</div>
</body>
</html>
