<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="fk fk-ground fk-pv">
<div class="fk-pv-row"><span class="fk-pv-cap">primary</span>
  <button class="fk-btn fk-btn-primary">Simpan</button>
  <button class="fk-btn fk-btn-primary is-hover">Hover</button>
  <button class="fk-btn fk-btn-primary is-active">Pressed</button>
  <button class="fk-btn fk-btn-primary is-focus">Focus</button>
  <button class="fk-btn fk-btn-primary" disabled>Disabled</button></div>
<div class="fk-pv-row"><span class="fk-pv-cap">glass</span>
  <button class="fk-btn fk-btn-glass">Simpan</button>
  <button class="fk-btn fk-btn-glass is-hover">Hover</button>
  <button class="fk-btn fk-btn-glass is-active">Pressed</button>
  <button class="fk-btn fk-btn-glass is-focus">Focus</button>
  <button class="fk-btn fk-btn-glass" disabled>Disabled</button></div>
<div class="fk-pv-row"><span class="fk-pv-cap">outline</span>
  <button class="fk-btn fk-btn-outline">Simpan</button>
  <button class="fk-btn fk-btn-outline is-hover">Hover</button>
  <button class="fk-btn fk-btn-outline is-active">Pressed</button>
  <button class="fk-btn fk-btn-outline is-focus">Focus</button>
  <button class="fk-btn fk-btn-outline" disabled>Disabled</button></div>
<div class="fk-pv-row"><span class="fk-pv-cap">ghost</span>
  <button class="fk-btn fk-btn-ghost">Simpan</button>
  <button class="fk-btn fk-btn-ghost is-hover">Hover</button>
  <button class="fk-btn fk-btn-ghost is-active">Pressed</button>
  <button class="fk-btn fk-btn-ghost is-focus">Focus</button>
  <button class="fk-btn fk-btn-ghost" disabled>Disabled</button></div>
<div class="fk-pv-row"><span class="fk-pv-cap">fab · icon</span><button class="fk-fab" aria-label="Tambah"><i data-i="plus"></i></button><button class="fk-btn fk-btn-glass icon" aria-label="Kembali"><i data-i="arrow-left"></i></button><span class="fk-small fk-muted">Hover the FAB: it turns 90°. Press anything: ripple.</span></div>
</div>
<script>
Falak.boot();

</script>
</body>
</html>
